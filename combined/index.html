<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic RAG Operations</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui;margin:0;color:#20272c;background:#f5f7f8;letter-spacing:0}header{background:#fff;border-bottom:1px solid #d5dcdf;padding:20px 5%}h1{font-size:23px;margin:0}main{max-width:1050px;margin:auto;padding:28px 20px}h2{font-size:18px}label{display:block;margin:16px 0 6px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #adb9bf;border-radius:4px;max-width:100%}input,textarea{width:100%}textarea{min-height:110px}button{cursor:pointer;background:#086a60;color:white;border:0;margin-top:16px}button:disabled{opacity:.5}select{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.status{color:#6d4c00}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:16px;border:1px solid #d5dcdf;font:13px ui-monospace}#login{max-width:380px}details{margin-top:18px}section{margin-bottom:26px}[hidden]{display:none!important}a{color:#086a60}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:19px}}
</style></head><body><header><h1>Agentic RAG Incident Investigation &amp; Support Automation</h1></header><main>
<section id="login"><h2>Sign in</h2><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section>
<section id="workspace" hidden><button id="logout" style="float:right;background:#555">Sign out</button><h2>New case</h2><form id="caseForm"><label for="question">Question or incident</label><textarea id="question" required minlength="3" maxlength="12000"></textarea><div class="grid"><div><label for="domain">Domain</label><select id="domain"><option value="auto">Automatic</option><option value="it">IT support</option><option value="security">Security</option><option value="production">Production / SRE</option><option value="cloud">Cloud</option><option value="data">Data engineering</option></select></div><div><label for="severity">Reported severity</label><select id="severity"><option>medium</option><option>low</option><option>high</option><option>critical</option></select></div></div><label for="logs">Logs (optional)</label><textarea id="logs"></textarea><button id="submit">Analyze case</button></form><section id="result" hidden><h2 id="route"></h2><p id="answer"></p><p id="evidenceOrigin" class="status"></p><h2>Ticket draft</h2><pre id="ticket"></pre><details><summary>Investigation and sources</summary><pre id="evidence"></pre></details><details><summary>Complete response</summary><pre id="raw"></pre></details></section><button id="history">Recent cases</button><pre id="historyOutput" hidden></pre></section><p id="status" class="status" role="status"></p><a href="/docs">API reference</a> · <a href="/architecture.svg" target="_blank">Architecture</a></main>
<script>
let token='';const $=id=>document.getElementById(id);async function call(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{token=(await call('/auth/login',{username:$('username').value,password:$('password').value})).access_token;$('login').hidden=true;$('workspace').hidden=false;$('password').value='';$('status').textContent='Local offline mode. Drafts require review; no external actions are executed.'}catch(e){$('status').textContent=e.message}};
$('logout').onclick=()=>{token='';$('workspace').hidden=true;$('login').hidden=false;$('result').hidden=true;$('status').textContent='Signed out.'};
$('caseForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('result').hidden=true;$('status').textContent='Analyzing...';try{const data=await call('/cases',{question:$('question').value,domain:$('domain').value,severity:$('severity').value,logs:$('logs').value.split('\n').filter(x=>x.trim())});$('result').hidden=false;$('route').textContent=data.routing.path+' / '+(data.routing.domain||'needs clarification');$('answer').textContent=data.answer;const origins=data.investigation?.evidence_summary;$('evidenceOrigin').textContent=origins?`Unverified assessment. Evidence: ${origins.user_supplied} user-supplied, ${origins.local_simulation} simulated, ${origins.rule_derived} rule-derived.`:'';$('ticket').textContent=JSON.stringify(data.ticket_draft,null,2);$('evidence').textContent=JSON.stringify(data.investigation||data.support,null,2);$('raw').textContent=JSON.stringify(data,null,2);$('status').textContent='Completed in '+data.latency_ms+' ms. Offline prototype; review findings before acting.'}catch(e){$('status').textContent=e.message}finally{$('submit').disabled=false}};
$('history').onclick=async()=>{try{$('historyOutput').hidden=false;$('historyOutput').textContent=JSON.stringify((await call('/cases')).map(c=>({question:c.question,routing:c.routing,id:c.id})),null,2)}catch(e){$('status').textContent=e.message}};
</script></body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise Agentic RAG Support Automation Platform Architecture</title>
  <desc id="desc">System architecture for an enterprise IT support automation platform using Streamlit, FastAPI, LlamaIndex Workflows, hybrid RAG, ticket intelligence, persistence, metrics, and deployment components.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7f7"/>
      <stop offset="100%" stop-color="#ffe6e6"/>
    </linearGradient>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 26px Arial, sans-serif; fill: #070b18; }
      .box { fill: url(#pink); stroke: #111827; stroke-width: 1.4; rx: 6; }
      .panel { fill: url(#panel); stroke: #8cb8ff; stroke-width: 1.3; rx: 8; }
      .store { fill: #eef6ff; stroke: #083f9e; stroke-width: 1.7; }
      .external { fill: #fff4f4; stroke: #ff4040; stroke-width: 1.4; rx: 8; }
      .infra { fill: #fff2f2; stroke: #214f9f; stroke-width: 1.2; rx: 4; }
      .label { font: 700 15px Arial, sans-serif; fill: #101827; }
      .small { font: 12px Arial, sans-serif; fill: #111827; }
      .tiny { font: 11px Arial, sans-serif; fill: #111827; }
      .white { fill: #ffffff; stroke: #0d55c7; stroke-width: 1.2; rx: 5; }
      .green { stroke: #14911f; }
      .purple { stroke: #7b1fff; }
      .yellow { stroke: #f5b400; }
      .red { stroke: #ff3b3b; }
      .blue { stroke: #006bff; }
      .arrow { fill: none; stroke-width: 2.4; marker-end: url(#arrowhead); }
      .dash { stroke-dasharray: 7 7; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
